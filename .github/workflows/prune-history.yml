name: Prune Old Workflow Runs

on:
  schedule:
    - cron: '0 4 * * *' # Tous les jours à 04:00 UTC
  workflow_dispatch:

jobs:
  prune:
    name: Prune History (Keep 7 days + 5 last)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: 7
          MIN_KEPT_RUNS: 5
        run: |
          echo "Policy: Keep at least last $MIN_KEPT_RUNS runs, delete others older than $RETENTION_DAYS days."

          # 1. Calculer la date limite (ISO 8601 pour comparaison de chaînes JSON/JQ)
          # Note: ubuntu-latest utilise GNU date
          CUTOFF=$(date -u -d "-$RETENTION_DAYS days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff date: $CUTOFF"

          # 2. Récupérer les runs, ignorer les (MIN_KEPT_RUNS) premiers, filtrer par date
          # gh run list retourne par défaut du plus récent au plus ancien
          RUNS_TO_DELETE=$(gh run list --repo ${{ github.repository }} --limit 300 --json databaseId,createdAt --jq "
            .[$MIN_KEPT_RUNS:] | .[] | select(.createdAt < \"$CUTOFF\") | .databaseId
          ")

          # 3. Supprimer
          if [ -z "$RUNS_TO_DELETE" ]; then
            echo "✅ No runs to delete."
          else
            count=$(echo "$RUNS_TO_DELETE" | wc -l)
            echo "🗑️ Found $count runs to delete."
            
            for run_id in $RUNS_TO_DELETE; do
              echo "Deleting run $run_id..."
              gh run delete --repo ${{ github.repository }} "$run_id" || echo "⚠️ Failed to delete $run_id"
            done
            echo "✅ Cleanup complete."
          fi
