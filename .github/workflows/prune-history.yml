name: Prune Old Workflow Runs

on:
  schedule:
    - cron: '0 4 * * *' # Tous les jours à 04:00 UTC
  workflow_dispatch:

jobs:
  prune:
    name: Prune CI History (Keep last 10)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old CI workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_KEPT_RUNS: 10
        run: |
          echo "Policy: Keep only last $MIN_KEPT_RUNS CI runs, delete all older ones."

          # Récupérer les runs du workflow CI, ignorer les (MIN_KEPT_RUNS) premiers
          RUNS_TO_DELETE=$(gh run list --repo ${{ github.repository }} --workflow ci.yml --limit 300 --json databaseId | jq --argjson n "$MIN_KEPT_RUNS" -r ".[$n:] | .[].databaseId")

          # 3. Supprimer
          if [ -z "$RUNS_TO_DELETE" ]; then
            echo "✅ No runs to delete."
          else
            count=$(echo "$RUNS_TO_DELETE" | wc -l)
            echo "🗑️ Found $count runs to delete."
            
            for run_id in $RUNS_TO_DELETE; do
              echo "Deleting run $run_id..."
              gh run delete --repo ${{ github.repository }} "$run_id" || echo "⚠️ Failed to delete $run_id"
            done
            echo "✅ Cleanup complete."
          fi
